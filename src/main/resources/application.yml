server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chat_db
    username: postgres
    password: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  docker:
    compose:
      enabled: true

  cloud:
    aws:
      # Эндпоинт для подключения (для MinIO или LocalStack)
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      credentials:
        # Ваши ключи доступа
        access-key: minioadmin
        secret-key: minioadmin
      s3:
        # Ключевая настройка для MinIO! Включает path-style addressing.
        path-style-access-enabled: true
        bucket: attachments
        region: eu-west-1
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.roleplace: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
jwt:
  secret: niggers-and-peoples-are-absolutely-equals
  expiration: 3600000
